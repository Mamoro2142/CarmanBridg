name: Karman Android — test and build
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: karman-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify project files
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
      - name: Fix known Kotlin compilation errors (CI only)
        shell: bash
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          base = Path('app/src/main/java/com/mamoro/karman')
          fixes = {
              'KarmanUi.kt': [
                  ('PrimaryAction("Сохранить") {', 'PrimaryAction("Сохранить", click = {'),
                  ('} catch(e:Exception) {error=e.message?:"Проверьте введённые данные"}\n            }\n        }\n    }\n}',
                   '} catch(e:Exception) {error=e.message?:"Проверьте введённые данные"}\n            })\n        }\n    }\n}')
              ],
              'SettingsUi.kt': [
                  ('PaddingValues(horizontal=18.dp,vertical=8.dp,bottom=30.dp)',
                   'PaddingValues(start=18.dp,end=18.dp,top=8.dp,bottom=30.dp)')
              ],
          }
          for name, replacements in fixes.items():
              path = base / name
              code = path.read_text(encoding='utf-8')
              for before, after in replacements:
                  if code.count(before) == 1:
                      code = code.replace(before, after)
                  elif after in code:
                      print(name, 'already fixed')
                  else:
                      raise SystemExit(name + ': expected source text missing')
              path.write_text(code, encoding='utf-8')
              print(name, 'fixed')
          PYFIX
      - name: Apply Karman 1.0.1 source upgrade
        shell: bash
        run: |
          test -f apply_upgrade.py || { echo "Missing apply_upgrade.py in repository root"; exit 1; }
          python3 apply_upgrade.py
          grep -q 'versionCode = 2' app/build.gradle.kts
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: SDK platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore private signing key from GitHub secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KARMAN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KARMAN_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KARMAN_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KARMAN_KEY_ALIAS }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/karman-release.p12"
            test -s "$RUNNER_TEMP/karman-release.p12"
            echo "KARMAN_KEYSTORE_PATH=$RUNNER_TEMP/karman-release.p12" >> "$GITHUB_ENV"
            echo "KARMAN_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KARMAN_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "KARMAN_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KARMAN_HAS_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "No release signing secrets. Only debug APK will be generated."
          fi
      - name: Unit tests, lint, and debug APK
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload exact Kotlin source compiled in this run
        uses: actions/upload-artifact@v4
        with:
          name: Karman-1.0.1-applied-source
          path: |
            app/src/main/java/com/mamoro/karman/KarmanUi.kt
            app/src/main/java/com/mamoro/karman/SettingsUi.kt
            app/src/main/java/com/mamoro/karman/KarmanViewModel.kt
            app/src/main/java/com/mamoro/karman/LedgerDb.kt
            app/src/test/java/com/mamoro/karman/LedgerDbTest.kt
            app/build.gradle.kts
          if-no-files-found: error
      - name: Upload debug APK (not stable for future updates)
        uses: actions/upload-artifact@v4
        with:
          name: Karman-1.0.1-DEBUG-not-for-updates
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Assemble privately signed release APK
        if: env.KARMAN_HAS_SIGNING == 'true'
        run: gradle --no-daemon --console=plain :app:assembleRelease
      - name: Upload installable signed release APK
        if: env.KARMAN_HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Karman-1.0.1-RELEASE-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Karman-verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          
